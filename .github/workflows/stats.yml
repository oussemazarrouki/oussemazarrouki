name: Generate Profile Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate Stats Card
        uses: soulteary/github-readme-stats-action@v1
        with:
          card: stats
          options: "username=oussemazarrouki&show_icons=true&hide_rank=true&count_private=true&include_all_commits=true&theme=tokyonight&hide_border=true"
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Generate Top Languages Card
        uses: soulteary/github-readme-stats-action@v1
        with:
          card: top-langs
          options: "username=oussemazarrouki&layout=compact&theme=tokyonight&hide_border=true&langs_count=6"
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit generated cards
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/
          git commit -m "Update profile stats with private repos" || exit 0
          git push
